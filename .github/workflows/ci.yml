name: CI

on:
  push:
    branches: [dev]

  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      CI_SCHEMA: CI_RUN_${{ github.run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linter
        run: |
          pip install ruff
          ruff check .
      

      # - name: Run unit tests
      #   run: |
      #     pip install pytest
      #     pytest tests/

      - name: Build airflow image 
        run: docker build -f airflow.dockerfile -t airflow:ci-check .

      - name: Setup dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOL
          banking_dbt:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                password: ${{ secrets.SNOWFLAKE_PASSWORD }}
                role: ACCOUNTADMIN
                database: BANKING
                warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
                schema: ${{ env.CI_SCHEMA }}
          EOL

      - name: dbt validation
        run: |
          cd banking_dbt
          dbt deps
          dbt build
      - name: clear schema CI
        if: always()
        run: |
          cd banking_dbt
          python -c "
          import os, snowflake.connector
          conn = snowflake.connector.connect(
              account=os.environ['SNOWFLAKE_ACCOUNT'],
              user=os.environ['SNOWFLAKE_USER'],
              password=os.environ['SNOWFLAKE_PASSWORD'],
              role='ACCOUNTADMIN',
              warehouse=os.environ['SNOWFLAKE_WAREHOUSE'],
          )
          conn.cursor().execute(f\"DROP SCHEMA IF EXISTS BANKING.{os.environ['CI_SCHEMA']}\")
          conn.close()
          print('Cleaned up CI schema:', os.environ['CI_SCHEMA'])
          "
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
