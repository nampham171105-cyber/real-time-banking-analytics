snapshots:
  - name: customer_snapshot
    relation: ref('stg_customer')
    config:
      database: banking
      unique_key: customer_id
      strategy: check
      check_cols:
        - first_name
        - last_name
        - email
        - is_deleted   # đọc trực tiếp từ cột nguồn, không còn suy ra từ CDC op