models:
  - name: dim_customer
    columns:
      - name: customer_id
        tests: [unique, not_null]

  - name: dim_account
    columns:
      - name: account_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - relationships:
              to: ref('customer_snapshot')
              field: customer_id

  - name: fact_transaction
    columns:
      - name: transaction_id
        tests: [unique, not_null]
      - name: account_id
        tests:
          - relationships:
              to: ref('dim_account')
              field: account_id